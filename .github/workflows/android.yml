name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'patches/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply pending source patches
        run: |
          UI=app/src/main/java/com/howverse/app/ui/HowverseApp.kt
          apply() {
            if [ -f "$1" ] && ! grep -q "$2" "$3"; then
              git apply "$1"
              echo "applied $1"
            fi
          }
          apply patches/live-section.patch LiveMedia "$UI"
          apply patches/live-strip.patch stripPhotos "$UI"
          apply patches/home-live.patch liveThumb "$UI"
          apply patches/voice.patch isNetworkConnectionRequired "$UI"
          apply patches/offline-lessons.patch domainFor app/src/main/java/com/howverse/app/data/OfflineBrain.kt

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/HOWVERSE-2.4-debug.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOWVERSE-debug-apk
          path: out/HOWVERSE-2.4-debug.apk
          if-no-files-found: error

      - name: Check whether v2.4.0 already exists
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.4.0 > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: HOWVERSE 2.4 — natural voices, real lesson plans
          body: |
            ## HOWVERSE 2.4

            ### Read-aloud that sounds like a person
            - The app now picks the **best voice the device has** for your language instead of whatever
              default it was handed: it prefers Google's network (natural) voices, then the highest
              quality tier, and avoids the compact ones.
            - Speech runs through **network synthesis** with tuned rate and pitch, so it sounds far less
              robotic than the offline engine.
            - If a language has no voice installed, the app says so and opens the Android voice
              installer instead of staying silent.

            ### Lessons that teach, not just talk
            - Offline answers are now **section-aware**: a cooking topic gets mise en place, taste-as-you-go
              and heat control; a coding topic gets read-the-error, smallest-useful-program and
              predict-before-you-run; maths gets units, validity conditions and substitute-back checks.
              Twelve sections have their own guidance, the rest use a sharper general plan.
            - Every plan is now ten concrete steps: what it is, what you need first, five words to learn,
              the first 30 minutes, one worked example, where people go wrong, how to check yourself,
              a mistake list, teach-it-back, and a spaced review at 3 days / 2 weeks.

            ### Also in this line
            - 2.3 — real photos on the home A–Z grid, action rows scroll instead of wrapping.
            - 2.2 — fixed the Wikimedia 403 by sending a proper user agent.
            - 2.1 — live section photos, image credits, latest-videos sort.

            ### APK details
            | | |
            |---|---|
            | File | `HOWVERSE-2.4-debug.apk` |
            | Package | `com.howverse.app` |
            | Version | 2.4 (versionCode 7) |
            | Min Android | 8.0 (API 26) |
            | Target | Android 15 (API 35) |
            | Signing | Android debug key |

            Debug-signed, updates over 2.0 – 2.3 (same package and key).
          files: out/HOWVERSE-2.4-debug.apk
          fail_on_unmatched_files: true
          draft: false
