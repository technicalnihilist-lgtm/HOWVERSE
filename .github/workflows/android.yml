name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'patches/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply pending source patches
        run: |
          UI=app/src/main/java/com/howverse/app/ui/HowverseApp.kt
          apply() {
            if [ -f "$1" ] && ! grep -q "$2" "$3"; then
              git apply "$1"
              echo "applied $1"
            fi
          }
          apply patches/live-section.patch LiveMedia "$UI"
          apply patches/live-strip.patch stripPhotos "$UI"
          apply patches/home-live.patch liveThumb "$UI"
          apply patches/voice.patch isNetworkConnectionRequired "$UI"
          apply patches/offline-lessons.patch domainFor app/src/main/java/com/howverse/app/data/OfflineBrain.kt
          apply patches/photo-viewer.patch viewerBitmap "$UI"

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/HOWVERSE-2.6-debug.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOWVERSE-debug-apk
          path: out/HOWVERSE-2.6-debug.apk
          if-no-files-found: error

      - name: Check whether v2.6.0 already exists
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.6.0 > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0
          name: HOWVERSE 2.6 — Latest videos actually sorted by date
          body: |
            ## HOWVERSE 2.6

            ### The "Latest" button now really lands on newest first
            - The upload-date filter (`sp=CAI%3D`) was being **silently dropped**: the app opened
              `m.youtube.com`, and the mobile site ignores that parameter — so you got ordinary
              relevance order and it looked like nothing happened.
            - The Latest button now opens the **desktop results page** (`www.youtube.com/results` with a
              desktop user agent) where the sort filter is honoured, so the newest uploads come first.
            - The header of that screen says **Latest · topic** so it is obvious which mode you are in.
            - The plain **Videos** button is unchanged: mobile YouTube, relevance order, still inside the
              app's own browser — Chrome never opens.

            ### Carried over
            - 2.5 — photos open in an in-app viewer instead of the browser.
            - 2.4 — natural network voices and section-aware lesson plans.
            - 2.3 — real photos on the home A–Z grid.

            ### APK details
            | | |
            |---|---|
            | File | `HOWVERSE-2.6-debug.apk` |
            | Package | `com.howverse.app` |
            | Version | 2.6 (versionCode 9) |
            | Min Android | 8.0 (API 26) |
            | Target | Android 15 (API 35) |
            | Signing | Android debug key |

            Debug-signed, updates over 2.0 – 2.5 (same package and key).
          files: out/HOWVERSE-2.6-debug.apk
          fail_on_unmatched_files: true
          draft: false
