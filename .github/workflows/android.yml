name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'patches/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply pending source patches
        run: |
          UI=app/src/main/java/com/howverse/app/ui/HowverseApp.kt
          if [ -f patches/live-section.patch ] && ! grep -q LiveMedia "$UI"; then
            git apply patches/live-section.patch
            echo "applied patches/live-section.patch"
          fi
          if [ -f patches/live-strip.patch ] && ! grep -q stripPhotos "$UI"; then
            git apply patches/live-strip.patch
            echo "applied patches/live-strip.patch"
          fi

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/HOWVERSE-2.2-debug.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOWVERSE-debug-apk
          path: out/HOWVERSE-2.2-debug.apk
          if-no-files-found: error

      - name: Check whether v2.2.0 already exists
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.2.0 > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: HOWVERSE 2.2 — section photos fixed
          body: |
            ## HOWVERSE 2.2

            Fixes the section photos not appearing in 2.1.

            ### What was wrong
            Wikimedia answers **403 Forbidden** to any request that arrives with a generic client
            user agent. The photo downloads in 2.1 carried no user agent of their own, so OkHttp sent
            its default `okhttp/4.12.0` and every image was rejected — the app fell back to the
            bundled artwork. The API call was unaffected, which is why photos were found but never
            drawn.

            ### What changed
            - Every Commons request, API and image alike, now identifies the app explicitly.
            - The "Fresh photos" strip asks for 330 px thumbnails instead of 960 px ones, so opening a
              section uses roughly 250 KB of data instead of ~2 MB.
            - If a live photo still cannot be downloaded, the section says so in plain words and keeps
              the bundled photo — never a blank frame.

            ### APK details
            | | |
            |---|---|
            | File | `HOWVERSE-2.2-debug.apk` |
            | Package | `com.howverse.app` |
            | Version | 2.2 (versionCode 5) |
            | Min Android | 8.0 (API 26) |
            | Target | Android 15 (API 35) |
            | Signing | Android debug key |

            Debug-signed, updates over 2.0 / 2.1 (same package and key).
          files: out/HOWVERSE-2.2-debug.apk
          fail_on_unmatched_files: true
          draft: false
