name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'patches/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply pending source patches
        run: |
          UI=app/src/main/java/com/howverse/app/ui/HowverseApp.kt
          apply() {
            if [ -f "$1" ] && ! grep -q "$2" "$3"; then
              git apply "$1"
              echo "applied $1"
            fi
          }
          apply patches/live-section.patch LiveMedia "$UI"
          apply patches/live-strip.patch stripPhotos "$UI"
          apply patches/home-live.patch liveThumb "$UI"
          apply patches/voice.patch isNetworkConnectionRequired "$UI"
          apply patches/offline-lessons.patch domainFor app/src/main/java/com/howverse/app/data/OfflineBrain.kt
          apply patches/photo-viewer.patch viewerBitmap "$UI"

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/HOWVERSE-2.5-debug.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOWVERSE-debug-apk
          path: out/HOWVERSE-2.5-debug.apk
          if-no-files-found: error

      - name: Check whether v2.5.0 already exists
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.5.0 > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: HOWVERSE 2.5 — photos open in the app
          body: |
            ## HOWVERSE 2.5

            ### Photos stay inside the app
            - Tapping a section photo — the hero image or any thumbnail in the **Fresh photos** strip —
              now opens it in an in-app viewer: the picture large, with its title, author and licence
              underneath, and a Close button. No browser, no Wikipedia tab.
            - The credit line under the hero is now plain text instead of a link, and the rows in
              **Profile → Image credits** no longer jump to the browser either.
            - The viewer keeps one deliberate link — **Licence** — because CC BY / CC BY-SA require a
              link to the licence terms. It opens the licence page only, never the photo's Wikipedia page.

            ### Videos
            - Videos already open inside the app (the in-app browser in `VideoActivity`), both the
              **Videos** button and the **Latest** button. Nothing about that changed — YouTube playback
              stays in the app, not in Chrome.

            ### APK details
            | | |
            |---|---|
            | File | `HOWVERSE-2.5-debug.apk` |
            | Package | `com.howverse.app` |
            | Version | 2.5 (versionCode 8) |
            | Min Android | 8.0 (API 26) |
            | Target | Android 15 (API 35) |
            | Signing | Android debug key |

            Debug-signed, updates over 2.0 – 2.4 (same package and key).
          files: out/HOWVERSE-2.5-debug.apk
          fail_on_unmatched_files: true
          draft: false
