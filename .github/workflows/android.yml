name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'patches/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply pending source patches
        run: |
          UI=app/src/main/java/com/howverse/app/ui/HowverseApp.kt
          if [ -f patches/live-section.patch ] && ! grep -q LiveMedia "$UI"; then
            git apply patches/live-section.patch
            echo "applied patches/live-section.patch"
          fi
          if [ -f patches/live-strip.patch ] && ! grep -q stripPhotos "$UI"; then
            git apply patches/live-strip.patch
            echo "applied patches/live-strip.patch"
          fi
          if [ -f patches/home-live.patch ] && ! grep -q liveThumb "$UI"; then
            git apply patches/home-live.patch
            echo "applied patches/home-live.patch"
          fi

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/HOWVERSE-2.3-debug.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOWVERSE-debug-apk
          path: out/HOWVERSE-2.3-debug.apk
          if-no-files-found: error

      - name: Check whether v2.3.0 already exists
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.3.0 > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: HOWVERSE 2.3 — photos on the home grid
          body: |
            ## HOWVERSE 2.3

            ### New
            - **Home tiles use the real photos too.** The A–Z grid now asks Wikimedia Commons for a
              free-licensed photo of each section and shows it in place of the bundled artwork. Tiles
              load lazily — only the sections you can see are fetched — and fall back to the bundled
              artwork if a photo cannot be downloaded.
            - **No more wrapped buttons.** The action rows on the home card and the section page scroll
              sideways instead of squeezing "Download" onto three lines.

            ### Also in this line
            - 2.2 fixed the 403 from Wikimedia by sending a proper user agent on image downloads.
            - 2.1 added live section photos, photo credits and the latest-videos sort.

            ### APK details
            | | |
            |---|---|
            | File | `HOWVERSE-2.3-debug.apk` |
            | Package | `com.howverse.app` |
            | Version | 2.3 (versionCode 6) |
            | Min Android | 8.0 (API 26) |
            | Target | Android 15 (API 35) |
            | Signing | Android debug key |

            Debug-signed, updates over 2.0 / 2.1 / 2.2 (same package and key).
          files: out/HOWVERSE-2.3-debug.apk
          fail_on_unmatched_files: true
          draft: false
